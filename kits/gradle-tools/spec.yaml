schemaVersion: "2"
kind: mixin
name: gradle-tools
displayName: Gradle build tools
description: Installs Gradle development tools and a Claude Code --yolo convenience flag.

setup:
  install:
    - command: >-
        find /var/lib/apt/lists -mindepth 1 -delete &&
        apt-get update &&
        apt-get install -y build-essential curl python3 vim
        openjdk-8-jdk-headless openjdk-17-jdk-headless openjdk-25-jdk-headless &&
        find /var/lib/apt/lists -mindepth 1 -delete
      description: Install native build tools, curl, Python 3, Vim, Java 8, Java 17, and Java 25
    - command: |
        set -eu
        hook='. /home/agent/.config/scripts/claude-yolo.sh'
        test -r /home/agent/.config/scripts/claude-yolo.sh
        touch /etc/sandbox-persistent.sh
        if ! grep -Fqx "$hook" /etc/sandbox-persistent.sh; then
          printf '\n%s\n' "$hook" >> /etc/sandbox-persistent.sh
        fi
      description: Add the Claude Code --yolo convenience flag to sandbox shells
