schemaVersion: "2"
kind: mixin
name: gradle-tools
displayName: Gradle and Orca build tools
description: Installs the native compiler toolchain and a Java 21 runtime for Gradle builds.

setup:
  install:
    - command: apt-get update && apt-get install -y build-essential openjdk-21-jdk-headless
      description: Install native build tools and Java 21

