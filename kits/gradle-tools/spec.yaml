schemaVersion: "2"
kind: mixin
name: gradle-tools
displayName: Gradle and agent build tools
description: Installs Java 25, native build tools, and Codex CLI for Gradle development.

setup:
  install:
    - command: apt-get update && apt-get install -y build-essential curl openjdk-25-jdk-headless
      description: Install native build tools, curl, and Java 25
    - command: >-
        curl -fsSL https://chatgpt.com/codex/install.sh |
        CODEX_NON_INTERACTIVE=true CODEX_INSTALL_DIR=/usr/local/bin CODEX_HOME=/opt/codex sh
      description: Install Codex CLI for optional use alongside Claude
