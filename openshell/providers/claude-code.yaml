# Copy of NVIDIA/OpenShell providers/claude-code.yaml with binaries matching
# openshell/Dockerfile (Claude Code at /usr/local/bin/claude).
#
# Credential scope:  ANTHROPIC_API_KEY or CLAUDE_API_KEY, sent as the x-api-key
#                    header to the endpoints below and nowhere else. The agent
#                    only ever sees a placeholder value.
# Endpoint access:   api.anthropic.com for inference; statsig.anthropic.com and
#                    sentry.io for the CLI's telemetry and error reporting.
# Import:            openshell provider profile lint   -f openshell/providers/claude-code.yaml
#                    openshell provider profile import -f openshell/providers/claude-code.yaml

id: claude-code
display_name: Claude Code
description: Claude Code CLI
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: Anthropic API key used by Claude Code
    env_vars: [ANTHROPIC_API_KEY, CLAUDE_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
discovery:
  credentials: [api_key]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: statsig.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: sentry.io
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/claude]
