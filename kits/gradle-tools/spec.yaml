schemaVersion: "2"
kind: mixin
name: gradle-tools
displayName: Gradle build tools
description: Installs Java 25 and native build tools for Gradle development.

setup:
  install:
    - command: apt-get update && apt-get install -y build-essential curl openjdk-25-jdk-headless
      description: Install native build tools, curl, and Java 25
